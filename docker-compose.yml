services:
  db:
    image: postgres:16-alpine
    container_name: waste2worth_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: waste2worth
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: waste2worth_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/waste2worth
      SECRET_KEY: production-secret-key-waste2worth-platform-2026
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      MODEL_PATH: /app/waste2worth_resnet18.pth
      CLASS_NAMES_PATH: /app/class_names.json
      UPLOAD_DIR: /app/backend/uploads
      CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - backend_uploads:/app/backend/uploads

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: waste2worth_frontend
    restart: always
    environment:
      NODE_ENV: production
      BACKEND_INTERNAL_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_uploads:
